# Global values
global:
  namespace: default

# MySQL Database configuration
mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3306
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
  env:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: vetclinic

# VetClinic App configuration
vetclinic:
  enabled: true
  image:
    repository: dragosteleaga/vetclinic
    tag: 1.2
    pullPolicy: Always
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  env:
    SPRING_DATASOURCE_URL: jdbc:mysql://{{ .Release.Name }}-mysql:3306/vetclinic
    SPRING_DATASOURCE_USERNAME: root
    SPRING_DATASOURCE_PASSWORD: root
    SPRING_JPA_HIBERNATE_DDL_AUTO: update
    SPRING_JPA_SHOW_SQL: "true"

# Auth VetClinic App configuration
authVetclinic:
  name: auth-vetclinic
  enabled: true
  image:
    repository: dragosteleaga/authvetclinic
    tag: 1.4
    pullPolicy: Always
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  env:
    SPRING_DATASOURCE_URL: jdbc:mysql://{{ .Release.Name }}-mysql:3306/vetclinic
    SPRING_DATASOURCE_USERNAME: root
    SPRING_DATASOURCE_PASSWORD: root
    SPRING_JPA_HIBERNATE_DDL_AUTO: update
    SPRING_JPA_SHOW_SQL: "true"

# Ingress configuration for external access
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: vetclinic.local
      paths:
        - path: /
          pathType: Prefix
          service: vetclinic-vetclinic  # <- FIXED name
          port: 8081
    - host: auth.vetclinic.local
      paths:
        - path: /
          pathType: Prefix
          service: auth-vetclinic       # <- should match the real service
          port: 8082