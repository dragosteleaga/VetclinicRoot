apiVersion: v1
kind: Service
metadata:
  name: vetclinic-auth
  labels:
    app: vetclinic-auth-vetclinic
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.authVetclinic.service.type }}
  ports:
    - port: {{ .Values.authVetclinic.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: vetclinic-auth-vetclinic
    release: {{ .Release.Name }}
